name: Bug report
description: Report a reproducible problem in shared kit behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private prompts, or other sensitive data. Report vulnerabilities through the security policy instead. Provider-specific problems belong in that extension's repository.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: The problem reproduces on the latest kit commit or release tag.
          required: true

  - type: input
    id: kit-version
    attributes:
      label: Kit version or commit
      description: Run `git -C src/kit describe --tags --always` in the consuming extension.
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: consumer
    attributes:
      label: Consuming extension and version
      placeholder: ampersand-bridge-copilot-chat 2.1.0
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Kit module
      options:
        - chat-completions / sse
        - messages
        - history-trim
        - response-writer / usage-payload
        - retry / stream / errors
        - credentials / remote-snapshot / pricing / context-size
        - autocomplete
        - unicode / token-count
        - vscode type augmentations
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and how often.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A failing `node:test` case or minimal input is ideal.
      render: ts
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
